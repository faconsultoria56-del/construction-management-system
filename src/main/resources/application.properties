# -------------------------------------------------------------------
# DATABASE CONFIGURATION
# -------------------------------------------------------------------
# Please update the following properties with your PostgreSQL details.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -------------------------------------------------------------------
# HIBERNATE CONFIGURATION
# -------------------------------------------------------------------
# 'create' will drop and re-create the database schema on every startup.
# This is useful for development but should be changed to 'validate' or 'none' for production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=management
server.port=${PORT}

spring.security.user.name=admin
spring.security.user.password=admin
